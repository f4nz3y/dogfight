
<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dogfight — Lab 02</title>
  </head>
  <body>
    <main class="game">
      <h1>Dogfight</h1>

      <div class="hud">
        <span>Здоров'я: <strong id="hp">3</strong></span>
        <span>Рахунок: <strong id="score">0</strong></span>
        <span>Керування: WASD / стрілки, Space — стрільба</span>
      </div>

      <canvas id="game" width="900" height="600"></canvas>

      <p>Збирай бонуси, знищуй астероїди та уникай зіткнень.</p>
      <button id="reset">Перезапустити гру</button>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
